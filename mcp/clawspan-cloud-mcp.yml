summary: >-
  ClawSpan operates ONE hosted MCP server for the ShardLink control plane at
  https://app.clawspan.cloud/v1/mcp/streamable (streamable-http). Anonymous initialize and tools/list both
  succeeded on 2026-09-19 (HTTP 200): serverInfo shardlink-mcp 2026-03-04.v1, protocolVersion 2025-06-18,
  capabilities.tools.listChanged false, 43 tools. The server is described by an MCP-registry server.json at
  /.well-known/mcp/server.json (also at /v1/mcp/server.json and returned by GET on the endpoint itself) and is
  listed in the official registry as cloud.clawspan/shardlink (two versions, latest published 2026-07-20).
  There is no stdio package; the npm SDK (@shardlink/agent-sdk) is a REST client, not an MCP server.
deployment:
  mode: remote
  endpoint: https://app.clawspan.cloud/v1/mcp/streamable
  auth: oauth
  verified: probed
  note: >-
    auth is recorded as oauth because RFC 9728 protected-resource metadata at
    /.well-known/oauth-protected-resource names this exact endpoint as the resource and
    https://clerk.clawspan.cloud as its authorization server, and 401s carry WWW-Authenticate with
    resource_metadata. In practice the discovery half of the surface is anonymous - initialize, tools/list and
    the five auth:public tools need no credential - and the 38 authenticated tools accept a Bearer session
    token minted by the wallet-challenge flow (POST /v1/auth/wallet/challenge then POST /v1/agents/self-register),
    which is a SIWE/EIP-4361 flow rather than an OAuth authorization-code flow. An agent without a wallet can
    only use the human OIDC route via Clerk.
