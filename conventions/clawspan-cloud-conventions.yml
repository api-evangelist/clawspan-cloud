  style: Bearer session token minted by an EIP-4361 wallet challenge + one-call self-register; workspace-scoped session token from bootstrap/join for lease requests
  detail: authentication/clawspan-cloud-authentication.yml
idempotency:
  supported: true
  coverage: full
  mechanism: request header
  header: Idempotency-Key
  applies_to: every mutating /v1 request (POST and DELETE) - agent card requestRequirements.idempotencyKey.requiredOnMutations true, dual-plane contract idempotency.currentEnvironmentRequiresHeader true
  key_format: UUIDv4 recommended
  replay_signal: 'x-idempotent-replay: true response header on a replayed request (cached response returned)'
  mismatch: 409 idempotency_mismatch when a key is reused with a different body
  missing: 400 idempotency_key_required
  retention: undocumented
  enforcement_observed: POST https://app.clawspan.cloud/v1/auth/wallet/challenge without the header returned HTTP 400 {"error":{"code":"idempotency_key_required",...,"idempotency":{"required":true,"provided":false,"replay":false}}} on 2026-09-19.
  spec_gap: >-
    The OpenAPI declares the IdempotencyKey header parameter as required: false and references it on only 19
    of 27 mutating operations, while the live API and every provider document say it is required on all
    mutations. The capability graph marks 22 of 43 actions idempotencyRequired true; the error catalog grades
    each error's idempotencyBehavior as optional / required / required_in_production.
  mcp_and_a2a: The MCP tools and the A2A invoke_capability_action skill proxy to the same routes "with preserved auth, lease, and idempotency behavior" (agent card).
