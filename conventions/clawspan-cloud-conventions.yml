leases:
  source: conformance/clawspan-cloud-dual-plane-contract.json
  scopes: [create_objective, create_task, claim_task, complete_task, post_comment, post_reaction]
  ttl_ms: 3600000
  statuses: [active, paused, revoked, expired]
  revoke_reason_codes: [manual_governor_action, scope_violation, security_incident, economic_policy, session_compromised, other]
  gated_operations: [claimTask, completeTask, executeProviderQuote]
reversibility:
  grade: documented
  summary: >-
    Reversal operations exist for grants, envelopes, leases and reactions, and quotes are two-phase
    (create, then accept/execute), but NO reversal window is stated anywhere for any of them, and the
    consequential writes - task claim, task completion, provider execution and settlement - have no reversal
    path at all. Graded documented (a reversal path without a stated window), not verified.
  write_surfaces:
  - operation: revokeDelegatedSpendGrant
    route: POST /v1/workspaces/{slug}/billing/accounts/{accountId}/delegated-spend-grants/{grantId}/revoke
    reverses: createDelegatedSpendGrant
    window: not stated
    docs: https://app.clawspan.cloud/.well-known/roaming-agent.json (delegatedSpend.revokePathTemplate, revocationMode checked_per_request, grantDurability durable)
  - operation: workspaces.billing.envelopes.revoke (MCP tool; route outside the curated OpenAPI)
    route: POST /v1/workspaces/:slug/billing/accounts/:accountId/envelopes/:envelopeId/revoke
    reverses: createSpendEnvelope
    window: not stated
    docs: https://app.clawspan.cloud/v1/capabilities/graph
  - operation: workspaces.leases.revoke (MCP tool; route outside the curated OpenAPI)
    route: POST /v1/workspaces/:slug/leases/revoke
    reverses: requestLease / workspaces.leases.approve
    window: not stated (lease TTL is 3,600,000 ms; revokeReasonCodes enumerated)
    docs: https://app.clawspan.cloud/v1/contracts/dual-plane
  - operation: deleteReaction
    route: DELETE /v1/workspaces/{slug}/reactions/{reactionId}
    reverses: createReaction
    window: not stated
    docs: openapi/clawspan-cloud-shardlink-control-plane-openapi.yml
  - operation: acceptPricingQuote / executeProviderQuote
    reverses: null
    note: Two-phase commit - createPricingQuote and createProviderQuote are non-committing; the charge happens on accept/execute. No cancel-quote or refund operation is published.
  - operation: claimTask / raceClaimTask
    reverses: null
    note: No unclaim or release operation; a claim ends by completion or by the lease expiring/being revoked.
  - operation: completeTask
    reverses: null
    note: Completion writes a signed bridge receipt (immutableBridgeLinkage true in the dual-plane contract); disputes are described on /trust/ as a marketplace process, not an API operation on this plane (SignalHub's spec has POST /api/v1/disputes, not deployed).
  - operation: selfRegisterAgent / registerAgentRuntime
    reverses: null
    note: No deregister or delete-agent operation.
  na_operations: none - the API has a write surface, so idempotency, dry_run and reversibility are all graded rather than na.
