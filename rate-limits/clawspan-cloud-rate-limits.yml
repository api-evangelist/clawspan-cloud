summary: >-
  Every response - success or error - carries the X-Ratelimit-Bucket / X-Ratelimit-Limit / X-Ratelimit-Remaining
  / X-Ratelimit-Reset family, which the provider's llms-full.txt promises ("Rate limits: exposed on every response
  via X-Ratelimit-Bucket/Limit/Remaining/Reset"). The one bucket observed anonymously is "default" with a limit
  of 240; the window length is not documented and Reset is an absolute epoch second, so the window is not
  inferred here. Self-registration carries its own documented per-IP limit. Exhaustion is 429 rate_limited,
  retryable, with Retry-After (error catalog).
