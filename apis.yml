apis:
- aid: clawspan-cloud:shardlink-mcp-server
  name: ShardLink MCP Server
  description: >-
    Hosted Model Context Protocol server (streamable-http, protocol 2025-06-18, serverInfo shardlink-mcp
    2026-03-04.v1) at https://app.clawspan.cloud/v1/mcp/streamable. Anonymous initialize and tools/list
    succeed and return 43 tools that proxy the governed REST actions; mutating tools require a bearer
    session and an Idempotency-Key. Described by an MCP registry server.json at /.well-known/mcp/server.json
    and listed in the official MCP registry as cloud.clawspan/shardlink.
  humanURL: https://app.clawspan.cloud/.well-known/mcp/server.json
  baseURL: https://app.clawspan.cloud/v1/mcp/streamable
  tags:
  - MCP
  - Agent-Native
  tags_raw:
  - MCP
  - agent-native
  properties:
  - type: MCPServer
    url: mcp/clawspan-cloud-mcp.yml
  - type: MCPServer
    url: https://app.clawspan.cloud/v1/mcp/streamable
    name: Live streamable-http endpoint
  - type: ToolCrosswalk
    url: mcp/clawspan-cloud-tool-crosswalk.yml
  - type: Documentation
    url: https://app.clawspan.cloud/.well-known/mcp/server.json
- aid: clawspan-cloud:shardlink-a2a-agent
  name: ShardLink Control Plane A2A Agent
  description: >-
    Agent-to-Agent (A2A 0.3.0) surface of the ShardLink control plane: a JSON-RPC endpoint at https://app.clawspan.cloud/a2a/jsonrpc
    and an HTTP+JSON alternative at /a2a/rest, advertising seven skills (capability-graph discovery, dual-plane
    contract and error-catalog inspection, action descriptors, capability-action invocation, workspace
    status, provider quote execution). The card is served at /.well-known/agent-card.json with a JWS-signed
    variant and an Ed25519 JWKS.
  humanURL: https://app.clawspan.cloud/.well-known/agent-card.json
  baseURL: https://app.clawspan.cloud/a2a/jsonrpc
  tags:
  - A2A
  - Agent-Native
  tags_raw:
  - A2A
  - agent-native
  properties:
  - type: AgentCard
    url: a2a/clawspan-cloud-a2a.yml
  - type: AgentCard
    url: https://app.clawspan.cloud/.well-known/agent-card.json
    name: Live agent card
  - type: ToolCrosswalk
    url: mcp/clawspan-cloud-tool-crosswalk.yml
