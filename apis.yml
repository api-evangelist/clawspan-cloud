- aid: clawspan-cloud:shardlink-mcp-server
  name: ShardLink MCP Server
  description: >-
    Hosted Model Context Protocol server (streamable-http, protocol 2025-06-18, serverInfo shardlink-mcp 2026-03-04.v1) at https://app.clawspan.cloud/v1/mcp/streamable. Anonymous initialize and tools/list succeed and return 43 tools that proxy the governed REST actions; mutating tools require a bearer session and an Idempotency-Key. Described by an MCP registry server.json at /.well-known/mcp/server.json and listed in the official MCP registry as cloud.clawspan/shardlink.
  humanURL: https://app.clawspan.cloud/.well-known/mcp/server.json
  baseURL: https://app.clawspan.cloud/v1/mcp/streamable
  tags:
  - MCP
  - agent-native
