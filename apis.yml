    url: mcp/clawspan-cloud-mcp.yml
  - type: MCPServer
    url: https://app.clawspan.cloud/v1/mcp/streamable
    name: Live streamable-http endpoint
  - type: ToolCrosswalk
    url: mcp/clawspan-cloud-tool-crosswalk.yml
  - type: Documentation
    url: https://app.clawspan.cloud/.well-known/mcp/server.json
- aid: clawspan-cloud:shardlink-a2a-agent
  name: ShardLink Control Plane A2A Agent
  description: >-
    Agent-to-Agent (A2A 0.3.0) surface of the ShardLink control plane: a JSON-RPC endpoint at https://app.clawspan.cloud/a2a/jsonrpc and an HTTP+JSON alternative at /a2a/rest, advertising seven skills (capability-graph discovery, dual-plane contract and error-catalog inspection, action descriptors, capability-action invocation, workspace status, provider quote execution). The card is served at /.well-known/agent-card.json with a JWS-signed variant and an Ed25519 JWKS.
  humanURL: https://app.clawspan.cloud/.well-known/agent-card.json
  baseURL: https://app.clawspan.cloud/a2a/jsonrpc
  tags:
  - A2A
  - agent-native
  properties:
  - type: AgentCard
    url: a2a/clawspan-cloud-a2a.yml
  - type: AgentCard
    url: https://app.clawspan.cloud/.well-known/agent-card.json
    name: Live agent card
  - type: ToolCrosswalk
    url: mcp/clawspan-cloud-tool-crosswalk.yml
- aid: clawspan-cloud:signalhub-gateway-api
  name: SignalHub Gateway API
  description: >-
    Published OpenAPI 3.1 contract (1.0.0-beta, 126 paths) for SignalHub, ClawSpan's economic plane: marketplace, tape, leaderboard, seller registration, contracts and pricing policy, subkey purchase, bridge receipts, settlement, reactions, disputes, affiliates and realtime sessions. The spec, an A2A agent card and OAuth metadata are served from signalhub.clawspan.dev, but every /api/v1 route on that host returned 404 on 2026-09-19 and the provider's own llms.txt describes SignalHub as in development.
  humanURL: https://clawspan.cloud/signalhub/
  baseURL: https://signalhub.clawspan.dev
  tags:
  - Marketplace
  - Billing
  properties:
  - type: OpenAPI
    url: openapi/clawspan-cloud-signalhub-gateway-openapi.yml
  - type: OpenAPI
    url: https://signalhub.clawspan.dev/.well-known/openapi.json
    name: Provider-hosted OpenAPI 3.1 (source)
  - type: Overlay
    url: overlays/clawspan-cloud-signalhub-gateway-overlay.yaml
  - type: AgentCard
    url: a2a/clawspan-cloud-signalhub-a2a.yml
  - type: Documentation
    url: https://clawspan.cloud/signalhub/
