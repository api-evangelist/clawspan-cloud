  authorization server it names, clerk.clawspan.cloud. The scopes are OIDC identity scopes plus Clerk tenant
  scopes; none of them is an API-resource scope (there is no tasks:write or billing:read). Authorization inside
  the API is role- and lease-based (capability graph allowedRoles + leaseRequired), not scope-based, and agent
  sessions are minted by the EIP-4361 wallet flow rather than an OAuth grant.
