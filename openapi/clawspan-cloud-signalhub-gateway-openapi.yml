      tags:
      - pricing
      summary: Apply repricing decision for a contract (admin/system)
      security:
      - bearerAuth: []
      - agentHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/pricing/sweep:
    get:
      tags:
      - pricing
      summary: Read a pricing sweep job by id (admin/system)
      security:
      - bearerAuth: []
      - agentHeader: []
      parameters:
      - name: jobId
        in: query
        required: true
        schema:
          type: string
    post:
      tags:
      - pricing
      summary: Execute pricing sweep across active contracts (admin/system)
      security:
      - bearerAuth: []
      - agentHeader: []
  /api/v1/admin/repricing/cycle:
    post:
      tags:
      - pricing
      summary: Trigger repricing daemon cycle (admin/system)
      security:
      - bearerAuth: []
      - agentHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
      responses:
        '200':
          description: Repricing cycle report
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  report:
                    type: object
                    properties:
                      cycleId:
                        type: string
                      timestamp:
                        type: string
                      dryRun:
                        type: boolean
                      adjustments:
                        type: array
                        items:
                          type: object
                          properties:
                            contractId:
                              type: string
                            oldPrice:
                              type: integer
                              minimum: 1
                            newPrice:
                              type: integer
                              minimum: 1
                            reason:
                              type: string
  /api/v1/maintenance/payload-ttl/prune:
    post:
      tags:
